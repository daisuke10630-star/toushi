name: 相場中の株価更新

# 分析（TOP5の選定など）は夜間バッチに任せ、こちらは株価だけを差し替える。
# 公開中のページをそのまま拾い直し、prices.json だけを新しくして再公開する。
on:
  schedule:
    # 東証の立会時間 9:00-15:30 JST = 0:00-6:30 UTC。15分ごとに更新する。
    # GitHubのスケジュールは混雑時に数分〜数十分ずれるため、時刻は保証されない。
    - cron: "*/15 0-6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 夜間バッチと重なった場合は、そちらを優先して待つ
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージのインストール
        run: pip install -r backend/requirements.txt

      - name: ページ本体の存在確認
        # 分析結果はリポジトリにコミット済みのものを使う。
        # 公開URLから取得し直すと、CDNが古い版を返したときに
        # 新しい分析結果を巻き戻してしまうため。
        run: |
          test -s docs/index.html
          touch docs/.nojekyll

      - name: 株価を更新
        run: python scripts/update_prices.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
