name: 日次レポートの生成と公開

# GitHub Actions の無料枠で動きます（パブリックリポジトリなら実行時間は無制限）。
# 自分のPCが起動していなくても実行されます。
on:
  schedule:
    # 東証の寄り付き（9:00 JST）前、6:10 JST に実行。
    # 主力の「ETF×米国前日終値タイミング」は、米国市場が引ける日本時間の
    # 早朝（冬時間で最も遅く6:00頃）にならないとシグナルが確定しないため、
    # 大引け後の20:30 JSTでは半日遅れの情報になってしまい実用にならない。
    # 6:10 JSTなら冬時間の引け（6:00頃）から10分のバッファを確保しつつ、
    # 東証が開く前（9:00）には十分間に合う。モメンタム・決算モメンタムも
    # 「前日までの確定データで当日の寄り付きに備える」という同じ考え方に揃えられる。
    # cron はUTCなので、JST 6:10 = 前日 21:10 UTC（日曜〜木曜のUTCで
    # 月〜金のJST朝になる）を指定する。
    - cron: "10 21 * * 0-4"
  # 手動実行もできるようにしておく（設定を変えた直後の確認用）
  workflow_dispatch:

# GitHub Pages への公開に必要な権限
permissions:
  contents: write
  pages: write
  id-token: write

# 実行が重なった場合は新しい方を優先する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージのインストール
        run: pip install -r backend/requirements.txt

      - name: レポート生成
        # --with-positions は付けない。保有銘柄・取得単価が公開ページに載るため。
        run: python scripts/build_site.py

      - name: 株価ファイルも初期化
        # 相場中の更新ワークフローが差し替えるが、夜間時点の値を入れておく
        run: python scripts/update_prices.py

      - name: 分析結果をコミット
        # 相場中の更新ワークフローがここから読む（公開URLの取得だとCDNの
        # 古いキャッシュで分析結果を巻き戻す事故が起きるため）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/index.html docs/report.json
          git diff --cached --quiet || git commit -m "日次レポートを更新 [skip ci]"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
