name: 日次レポートの生成と公開

# GitHub Actions の無料枠で動きます（パブリックリポジトリなら実行時間は無制限）。
# 自分のPCが起動していなくても実行されます。
on:
  schedule:
    # 東証の大引け（15:30 JST）から十分に間を置いた 20:30 JST に実行。
    # cron は UTC なので 11:30 UTC を指定する。
    - cron: "30 11 * * 1-5"
  # 手動実行もできるようにしておく（設定を変えた直後の確認用）
  workflow_dispatch:

# GitHub Pages への公開に必要な権限
permissions:
  contents: write
  pages: write
  id-token: write

# 実行が重なった場合は新しい方を優先する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージのインストール
        run: pip install -r backend/requirements.txt

      - name: レポート生成
        # --with-positions は付けない。保有銘柄・取得単価が公開ページに載るため。
        run: python scripts/build_site.py

      - name: 株価ファイルも初期化
        # 相場中の更新ワークフローが差し替えるが、夜間時点の値を入れておく
        run: python scripts/update_prices.py

      - name: 分析結果をコミット
        # 相場中の更新ワークフローがここから読む（公開URLの取得だとCDNの
        # 古いキャッシュで分析結果を巻き戻す事故が起きるため）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/index.html docs/report.json
          git diff --cached --quiet || git commit -m "日次レポートを更新 [skip ci]"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
